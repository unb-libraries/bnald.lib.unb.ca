name: Update bnald.lib.unb.ca

on:
  workflow_dispatch:
  schedule:
    - cron: '21 5 * * 1,4'

jobs:
  deploy:
    uses: unb-libraries/dockworker/.github/workflows/update.yaml@6.x
    with:
      add-paths: 'build/composer.*'
      php-version: '8.4'
      composer-version: '2.9.5'
    secrets:
      PAT_TOKEN: ${{ secrets.UNBLIBBOT_PAT_TOKEN }}
